
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Java 1</title>
</head>
<body>
    <label>Numri i pare</label>
    <input type="number" id="nr1">
    <br>
    <label>Numri i dyte</label>
    <input type="number" id="nr2">
    <br>

    <button type="button" onclick="mbledhja()">+</button>
    <button type="button" onclick="zbritja()">-</button>
    <button type="button" onclick="shumezimi()">*</button>
    <button type="button" onclick="pjesetimi()">/</button>

    <p id="rezultati"></p>

    <br>
    <hr>
    <h1>Ritje/zbritje te numrit</h1>
    <p id="numri">0</p>
    <button type="submit" onclick="rritje()">Ritje + </button>
    <button type="submit" onclick="zbritje()">Zbritje - </button>

    <script>
        var n=0;
        function rritje(){
            n=n+1;
             document.getElementById("numri").innerHTML = rezultati;
            
        }

        
        function mbledhja() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);
            var rezultati = a + b;
            document.getElementById("rezultati").innerHTML = rezultati;
        }

        function zbritja() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);
            var rezultati = a - b;
            document.getElementById("rezultati").innerHTML = rezultati;
        }

        function shumezimi() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);
            var rezultati = a * b;
            document.getElementById("rezultati").innerHTML = rezultati;
        }

        function pjesetimi() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            if (b == 0) {
                document.getElementById("rezultati").innerHTML =
                    "Nuk mund te pjesetojme me zero";
            }
            else {
                var rezultati = a / b;
                document.getElementById("rezultati").innerHTML = rezultati;
            }
        }
    </script>
</body>
</html>
